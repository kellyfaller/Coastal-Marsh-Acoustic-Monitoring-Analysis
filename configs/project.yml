paths:
  aru_locations: "data/metadata/aru_sites_stations.csv"
  recording_metadata: "data/metadata/Recording_Metadata.csv"
  arbimon_pm_results: "data/arbimon/pm_detections.csv"
  arbimon_species_meta: "data/arbimon/species.0001.csv"
  # point counts
  cattus_2025_pc: "data/point_count/Cattus_2025_Point_Count_Data_KFaller.csv"
  cattus_2026_pc: "data/point_count/Cattus_2026_Point_Count_Data_KFaller.csv"
  lhc_2025_pc: "data/point_count/LHC_2025_Point_Count_Data_KFaller.csv"
  lhc_2026_pc: "data/point_count/LHC_2026_Point_Count_Data_KFaller.csv"  
  site_metadata: "data/metadata/pointcount_site_metadata.csv"
  habitat_lookup: "data/point_count/spp_lookup_table.csv"
  # birdNET
  birdnet_results: "data/processed/birdNET/birdNET_results.csv"
  bird_guild: "data/metadata/species_list.csv"
  # Kaleidoscope Acoustic Index
  index: "data/processed/kaleidoscope_outputs/acoustic_indices_20242025combined.csv"
outputs:
  processed_dir: "data/processed"
  figures_dir:   "outputs/figures"
  reports_dir:   "outputs/reports"
  indices_dir: "outputs/indices"
  models_dir: "outputs/models"
photos:
  sparrow_image: "C:/Users/kfaller/Documents/GitHub/Acoustics/Images/SALS.png"
params:
 # project information
  year_one: 2024
  year_two: 2025
  year_three: 2026
 # point count analysis
  individual_birds: ["CLRA","BLRA","LEBI","AMBI","SORA","VIRA","KIRA","COGA"]
  focal_species: "RWBL" # for the density/abundance graphics. Specify which bird to run with
  focal_species_birdNET: "Saltmarsh Sparrow"
  total_area_m2: 2326317 
  point_count_radius: 200 #m2
  unidentified_pattern: "^UN[A-Z]{2}$|Unidentified" # codes matching this are kept in counts but left out of species richness/diversity
  distance_rings_m: [50, 100, 200] # outer edge of each distance band (0-50m, 51-100m, >100m) for the ring maps
  marsh_species_of_concern: ["SALS", "SESP", "NESP", "CLRA", "KIRA", "VIRA", "BLRA", "LEBI", "WILL", "MAWR"] # highlighted in the visit 1 vs visit 2 section; only ones actually detected are shown
  wading_birds: ["GREG", "SNEG", "GBHE", "LBHE", "TRHE", "GRHE", "CAEG", "BCNH", "YCNH", "UNNH", "WHIB", "GLIB"] # herons, egrets, ibises for the wading bird section
  wading_focus_species: "WHIB" # species looked at in detail in the wading bird section
  wading_focus_site: "Lighthouse Center"
  sufficiency_targets: [0.9, 0.95] # share of the estimated species pool used for "surveys needed" in the sampling sufficiency table
 # graphics
  height: 10
  width: 15
  dpi: 300
 # acoustic index generation 
  min_freq_hz: 0
  max_freq_hz: 16000
  db_threshold: -35
  session_length: 900
  cores: 10
  # mapping and embedded images/audio
  site_crs: 4326
  thresholds: [0.5, 0.75, 0.9, 0.95]
  use_leaflet_map: true       
  sparrow_image_path: "docs/images/SALS.png"
  map_center_lng: -75.15925
  map_center_lat: 39.045748
