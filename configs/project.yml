paths:
  aru_locations: "metadata/aru_sites_stations.csv"
  recording_metadata: "metadata/Recording_Metadata.csv"
  arbimon_pm_results: "data/processed/arbimon/pm_detections.csv"
  arbimon_species_meta: "data/processed/arbimon/species.0001.csv"
  # point counts
  cattus_2025_pc: "data/raw/point_count/Cattus_2025_Point_Count_Data_KFaller.csv"
  cattus_2026_pc: "data/raw/point_count/Cattus_2026_Point_Count_Data_KFaller.csv"
  lhc_2025_pc: "data/raw/point_count/LHC_2025_Point_Count_Data_KFaller.csv"
  lhc_2026_pc: "data/raw/point_count/LHC_2026_Point_Count_Data_KFaller.csv"  
  lhc_2023_2024_pc: "data/point_count/LHC_point_count_db_1-8-25_KRipple.csv"  # LHC 2023 + 2024 (K. Ripple); year comes from the survey dates
  site_metadata: "metadata/pointcount_site_metadata.csv"
  habitat_lookup: "data/raw/point_count/spp_lookup_table.csv"
  # birdNET
  birdnet_results: "archive/birdNET_results.csv" # old combined results, used by 03-BirdNET-Analysis.Rmd
  birdnet_raw_dir: "data/processed/birdNET" # holds <year>/<station>/BirdNET_CombinedTable files
  bird_guild: "metadata/species_list.csv"
  model_eval_dir: "data/processed/model_eval" # scores/<run>/<test set>/<station>/, test clips, labels, logs
  # Kaleidoscope Acoustic Index
  index: "data/processed/kaleidoscope_outputs/acoustic_indices_20242025combined.csv"
outputs:
  processed_dir: "data/processed"
  figures_dir:   "outputs/figures"
  reports_dir:   "outputs/reports"
  indices_dir: "outputs/indices"
  models_dir: "outputs/models"
  model_eval_dir: "outputs/model_eval"
# SALSNET model evaluation (analysis plan B1-B7)
evaluation:
  focal_species:
    SALS: "Saltmarsh Sparrow"
    NESP: "Nelson's Sparrow"
    SESP: "Seaside Sparrow"
  primary_species: "SALS"     # models are ranked on this species (B6.1)
  reference_model: "M0"       # stock BirdNET baseline
  test_sets:                  # folder names under scores/<run>/
    local: "local"            # one whole site-year of my ARU data, never trained on (B1.1)
    independent: "independent" # partner sites kept out of training (B1.2)
  threshold: 0.5              # cut-off for precision/recall/F1, confusion matrix and error list
  target_precision: 0.9       # B6.4 score cut-off
  min_positives: 5            # species with this many or fewer positive clips are too rare to score (B1.5)
  ap_flag: 0.8                # species below this AP are flagged for training (B2.3)
  tie_tolerance: 0.02         # models within this AP of the best count as tied (B6.3)
  n_boot: 1000                # bootstrap resamples for model comparisons
  min_detections_per_day: 2   # B7.2
  test_clip_bins:             # B1.3: clips drawn per species per site
    low_max: 0.1              # 1 clip scoring 0 to low_max
    n_low: 1
    n_high: 6                 # spread across low_max to 1.0, plus highest and lowest
  models:
    M0: {sources: [], description: "Stock BirdNET, no custom training"}
    M1: {sources: [my_aru], description: "Verified clips from my ARUs"}
    M2: {sources: [mic], description: "Focal follow (handheld mic) recordings only"}
    M3: {sources: [my_aru, mic], description: "My ARU clips plus focal follows"}
    M4: {sources: [my_aru, mic, partner], description: "Adds partner recordings from other marshes"}
    M5: {sources: [my_aru, mic, partner, phone], description: "Adds my phone recordings (optional)"}
photos:
  sparrow_image: "C:/Users/kfaller/Documents/GitHub/Acoustics/Images/SALS.png"
params:
 # project information
  year_one: 2024
  year_two: 2025
  year_three: 2026
  compare_years: [2025, 2026]   # the two years the year-to-year comparisons use (both sites surveyed)
  trend_site: "Lighthouse Center" # site with a longer record (2023-2026) for the multi-year trend section
 # point count analysis
  individual_birds: ["CLRA","BLRA","LEBI","AMBI","SORA","VIRA","KIRA","COGA"]
  focal_species: "RWBL" # for the density/abundance graphics. Specify which bird to run with
  focal_species_birdNET: "Saltmarsh Sparrow"
  birdnet_years: [2024, 2025, 2026] # years combined from birdnet_raw_dir; missing year folders are skipped
  total_area_m2: 2326317 
  point_count_radius: 200 #m2
  unidentified_pattern: "^UN[A-Z]{2}$|Unidentified|^\\?+$" # codes matching this are kept in counts but left out of species richness/diversity ("????" = unknown code)
  # Codes written differently on different datasheets for the same species -> the code used in the analysis
  alpha_code_synonyms:
    CANG: "CAGO"   # Canada Goose (old code)
    HEGU: "AHGU"   # Herring Gull -> American Herring Gull (used on the 2025-2026 sheets)
    EWPE: "EAWP"   # Eastern Wood-Pewee (EAWP is the standard code)
    CAWR: "CARW"   # Carolina Wren (CARW is the standard code; the 2023-2024 LHC file uses CARW)
    VOYE: "COYE"   # Common Yellowthroat (datasheet slip, Cattus 2026)
    GRFL: "GCFL"   # Great Crested Flycatcher (Cattus 2026)
  # Observer initials written differently on different datasheets -> one name per person
  observer_aliases:
    KF: "KNF"      # Kelly Faller (2023 LHC database) = KNF on the 2025-2026 sheets
  distance_rings_m: [50, 100, 200] # outer edge of each distance band (0-50m, 51-100m, >100m) for the ring maps
  marsh_species_of_concern: ["SALS", "SESP", "NESP", "CLRA", "KIRA", "VIRA", "BLRA", "LEBI", "WILL", "MAWR"] # highlighted in the visit 1 vs visit 2 section; only ones actually detected are shown
  wading_birds: ["GREG", "SNEG", "GBHE", "LBHE", "TRHE", "GRHE", "CAEG", "BCNH", "YCNH", "UNNH", "WHIB", "GLIB"] # herons, egrets, ibises for the wading bird section
  wading_focus_species: "WHIB" # species looked at in detail in the wading bird section
  wading_focus_site: "Lighthouse Center"
  sufficiency_targets: [0.9, 0.95] # share of the estimated species pool used for "surveys needed" in the sampling sufficiency table
 # graphics
  height: 10
  width: 15
  dpi: 300
 # acoustic index generation 
  min_freq_hz: 0
  max_freq_hz: 16000
  db_threshold: -35
  session_length: 900
  cores: 10
  # mapping and embedded images/audio
  site_crs: 4326
  thresholds: [0.5, 0.75, 0.9, 0.95]
  use_leaflet_map: true       
  sparrow_image_path: "docs/images/SALS.png"
  map_center_lng: -75.15925
  map_center_lat: 39.045748
